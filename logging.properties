# Java Util Logging Configuration for Traffic Simulator
# Author: M A T^2 H Team

# Global logging level 
.level=INFO

# Console handler configuration
handlers=java.util.logging.ConsoleHandler,java.util.logging.FileHandler

# Console output configuration
java.util.logging.ConsoleHandler.level=INFO
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter

# File output configuration
java.util.logging.FileHandler.pattern=traffic-simulator.log
java.util.logging.FileHandler.limit=5000000
java.util.logging.FileHandler.count=3
java.util.logging.FileHandler.level=ALL
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.FileHandler.append=true

# Custom format: timestamp [LEVEL] ClassName.methodName - message
java.util.logging.SimpleFormatter.format=%1$tF %1$tT [%4$s] %3$s - %5$s%6$s%n

# Per-class logging levels (optional - can be more granular)
TrafficSimulatorApp.level=INFO
NetworkParser.level=INFO
SimulationRunner.level=INFO
TrafficManager.level=INFO
VehicleAddPanel.level=INFO
TrafficLight.level=WARNING
ControlPanel.level=INFO
